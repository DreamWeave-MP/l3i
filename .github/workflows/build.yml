name: Library CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # Keep branch pushes restricted to main. Non-tag pushes publish to the shared
    # "development" release, so feature branches will compete for the same release.
    branches: main
    tags: ['*']

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/libGlobalBuild.yml@v46
    secrets: inherit
    with:
      crate_names: '["l3i"]'

      # l3i builds only under the clang cross-language LTO policy (TOOLCHAIN.md): every job that
      # compiles gets a clang and lld whose LLVM major matches the active rustc.
      llvm_toolchain: true

      # rust-version in Cargo.toml; the MSRV job matches that toolchain's LLVM major too.
      msrv: auto

      # Criterion hot paths (benches/hot_paths.rs) into BENCHMARKS.md on the release.
      generate_benchmarks: true

      # Not on crates.io yet. Flip to true (and add CARGO_REGISTRY_TOKEN) for the first release.
      cargo_publish: false
