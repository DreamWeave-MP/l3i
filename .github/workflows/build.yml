name: Library CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
    tags: ['*']

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/libGlobalBuild.yml@v55
    secrets: inherit
    with:
      crate_names: '["l3i"]'
      msrv: auto
      generate_benchmarks: true
      cargo_publish: true
      mod_template: true
