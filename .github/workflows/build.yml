name: Library CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # Keep branch pushes restricted to main. Non-tag pushes publish to the shared
    # "development" release, so feature branches will compete for the same release.
    branches: main
    tags: ['*']

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/libGlobalBuild.yml@v55
    secrets: inherit
    with:
      crate_names: '["l3i"]'

      # l3i builds only under the clang cross-language LTO policy (TOOLCHAIN.md). StroggForge's
      # setup-llvm step gives every job that compiles a clang and lld whose LLVM major matches the
      # active rustc; since v52 it runs unconditionally, so there is nothing to switch on here.

      # rust-version in Cargo.toml; the MSRV job matches that toolchain's LLVM major too.
      msrv: auto

      # Criterion hot paths (benches/hot_paths.rs) into BENCHMARKS.md on the release.
      generate_benchmarks: true

      # A bare version tag publishes that version to crates.io (CARGO_REGISTRY_TOKEN); every other
      # push dry-runs the publish.
      cargo_publish: true

      # StroggForge records each version crates.io has in content/home/mod.lock and deploys this
      # site, in place of the rustdoc Pages.
      mod_template: true
