name: CPU compute

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  # The comparison benches are off in every other build, so only this notices when the engine moves
  # out from under them. Checks and lints; running them is scripts/compute_compare.sh's job.
  comparisons:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v55
      - name: Pedantic Clippy with competitors compiled in
        run: >-
          cargo clippy --config "target.'cfg(all())'.rustflags=['--cfg','l3i_compare']"
          --benches --features compute-testing -- -W clippy::pedantic -D warnings
  # The same tournament on real hardware of each architecture, against OpenBLAS and BLIS as the
  # distribution builds them. Shared runners make these elapsed times evidence of shape, not of a
  # lead: hardware counters aren't available there, and nothing here can fail on speed.
  tournament:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v55
      - name: Install BLAS libraries
        run: sudo apt-get install -y libopenblas0-pthread libblis4-pthread
      - name: Record the CPU
        run: lscpu | tee "tournament-${{ matrix.runner }}.txt"
      - name: One thread, then all of them
        run: |
          arch_dir="/usr/lib/$(uname -m)-linux-gnu"
          export L3I_BENCH_BLAS="openblas=$arch_dir/openblas-pthread/libblas.so.3,blis=$arch_dir/blis-pthread/libblis.so.4"
          export L3I_BENCH_SHAPES=6x128x16,12x128x16,16x16x16,31x127x17,64x64x64,128x128x128,128x64x512,256x256x1,256x256x256,512x512x512,1024x1024x1024,1x4096x1,1x1024x1024
          run_matrix() {
            cargo bench --config "target.'cfg(all())'.rustflags=['--cfg','l3i_matrix']" \
              --features compute-testing --bench main -- compute_matrix
          }
          run_matrix | tee -a "tournament-${{ matrix.runner }}.txt"
          OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 L3I_BENCH_THREADS=4 L3I_BENCH_SHAPES=256x256x256,512x512x512,1024x1024x1024 \
            run_matrix | tee -a "tournament-${{ matrix.runner }}.txt"
      - name: Integer kernels and row stages
        run: |
          cargo bench --features compute-testing --bench main -- compute_int8 | tee -a "tournament-${{ matrix.runner }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-${{ matrix.runner }}
          path: tournament-${{ matrix.runner }}.txt
  correctness:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v55
      - name: Record compiler and CPU
        run: |
          rustc -vV
          clang --version
          lscpu
      - name: The extension with only its own feature
        run: |
          cargo test --features compute compute::
      - name: Debug no-JIT correctness
        run: |
          cargo test --features compute-testing compute::
      - name: Release no-JIT numerical correctness
        run: |
          cargo test --release --features compute-testing compute::
      - name: Release optional Luau JIT correctness
        run: |
          cargo test --release --features compute-testing,jit compute::
      - name: Pedantic Clippy, engine alone and with its test support
        run: |
          cargo clippy --features compute -- -W clippy::pedantic -D warnings
          cargo clippy --all-targets --features compute-testing,jit -- -W clippy::pedantic -D warnings
      # Runs on this runner's real CPU, for the record. Shared cloud machines are noisy, so this is
      # evidence about shape and instruction set, not a pass-fail gate on speed.
      - name: Native benchmarks
        run: |
          cargo bench --features compute-testing --bench main -- compute_shapes | tee "bench-${{ matrix.runner }}.txt"
          cargo bench --features compute-testing --bench main -- compute_softmax | tee -a "bench-${{ matrix.runner }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.runner }}
          path: bench-${{ matrix.runner }}.txt
