name: CPU compute

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  # The comparison benches are off in every other build, so only this notices when the engine moves
  # out from under them. Checks and lints; running them is scripts/compute_compare.sh's job.
  comparisons:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v55
      - name: Pedantic Clippy with competitors compiled in
        run: >-
          cargo clippy --config "target.'cfg(all())'.rustflags=['--cfg','l3i_compare']"
          --benches --features compute-testing -- -W clippy::pedantic -D warnings
  correctness:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: DreamWeave-MP/StroggForge/.github/actions/setup-llvm@v55
      - name: Record compiler and CPU
        run: |
          rustc -vV
          clang --version
          lscpu
      - name: Debug no-JIT correctness
        run: cargo test --features compute-testing compute::
      - name: Release no-JIT numerical correctness
        run: cargo test --release --features compute-testing compute::
      - name: Release optional Luau JIT correctness
        run: cargo test --release --features compute-testing,jit compute::
      - name: Pedantic Clippy, engine alone and with its test support
        run: |
          cargo clippy --features compute -- -W clippy::pedantic -D warnings
          cargo clippy --all-targets --features compute-testing,jit -- -W clippy::pedantic -D warnings
      # Runs on this runner's real CPU, for the record. Shared cloud machines are noisy, so this is
      # evidence about shape and instruction set, not a pass-fail gate on speed.
      - name: Native benchmarks
        run: |
          cargo bench --features compute-testing --bench main -- compute_shapes | tee "bench-${{ matrix.runner }}.txt"
          cargo bench --features compute-testing --bench main -- compute_softmax | tee -a "bench-${{ matrix.runner }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.runner }}
          path: bench-${{ matrix.runner }}.txt
