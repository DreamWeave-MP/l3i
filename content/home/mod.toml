# l3i. Structured facts only: the name and summary are `title` and `description` in index.md.
# Every key is explained at https://dreamweave-mp.github.io/DreamWeave-Mod-Template/guide/mod-toml/

# Permanent identity. Never changes, whatever the crate is called or wherever it is hosted.
id = "2198fb51-71ba-4695-8e1f-26b55144c4fd"

slug = "l3i"
type = "library"
status = "active"
license = "MIT OR Apache-2.0"

[[maintainers]]
name = "Dave Corley"
url = "https://github.com/magicaldave"

[links]
documentation = "@/docs/_index.md"
