# l3i. Structured facts only: the name and summary are `title` and `description` in index.md.
# Every key is explained at https://dreamweave-mp.github.io/DreamWeave-Mod-Template/guide/mod-toml/

# Permanent identity. Never changes, whatever the crate is called or wherever it is hosted.
id = "2198fb51-71ba-4695-8e1f-26b55144c4fd"

slug = "l3i"
type = "library"
status = "active"
license = "MIT OR Apache-2.0"

[[maintainers]]
name = "S3kshun8"
url = "https://github.com/magicaldave"

[links]
documentation = "@/docs/_index.md"
donate = "https://ko-fi.com/magicaldave"

# A Rust library. StroggForge's library workflow (.github/workflows/build.yml) tests it on every
# push; pushing a bare version tag, like 1.0.0, publishes that version to crates.io and records it
# here.
[package]
format = "crate"
crate = "l3i"

# The transport every runtime carries: the planner inserts the dream.udp bridge into every plan.
[[requires]]
id = "f82752ac-e7f6-43c0-8c2f-d91b7f6b3dda"
name = "dream-net"
version = "=1.1.0"
url = "https://DreamWeave-MP.github.io/dream-net/"
reason = "Runtime infrastructure: the @dream/udp module is in every plan, and l3i owns the bridge."

# The CPU rasterizer, bound as the dream.soft_render extension behind the soft-render feature.
[[recommends]]
id = "f7b9633b-b7cb-4db9-a19f-63556586a81d"
name = "dream-soft-render"
version = "=1.0.0"
url = "https://DreamWeave-MP.github.io/dream-soft-render/"
reason = "The @dream/soft-render module, when the soft-render feature is on."

