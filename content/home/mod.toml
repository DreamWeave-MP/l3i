# A Rust library. StroggForge's library workflow (.github/workflows/build.yml) tests it on every
# push; pushing a bare version tag, like 1.0.0, publishes that version to crates.io and records it
# here.
[package]
format = "crate"
crate = "l3i"

# The transport every runtime carries: the planner inserts the dream.net bridge into every plan.
[[requires]]
id = "f82752ac-e7f6-43c0-8c2f-d91b7f6b3dda"
