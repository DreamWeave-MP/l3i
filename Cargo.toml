[package]
name = "l3i"
version = "0.1.0"
description = "Luau binder for DreamWeave component crates: typed function binding, tagged and untagged userdata, direct userdata access, sandboxed runtimes"
authors = ["Dave Corley (S3kshun8) <corleycomputerrepair@protonmail.ch>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"
keywords = ["luau", "lua", "bindings", "gamedev"]
categories = ["api-bindings", "game-development"]
links = "luau"
# The whole package builds from this tree: the Luau submodule (`luau/`, MIT, pinned at the
# 0.740 release OpenMW pins; only the components the build uses are packaged) plus the binder's
# C++ additions and shims (`csrc/`). No network at build time, no separate Lua binding crate.
include = [
    "Cargo.toml",
    "build.rs",
    ".gitmodules",
    "src/**",
    "csrc/**",
    "luau/LICENSE.txt",
    "luau/lua_LICENSE.txt",
    "luau/Analysis/**",
    "luau/Ast/**",
    "luau/Bytecode/**",
    "luau/CodeGen/**",
    "luau/Common/**",
    "luau/Compiler/**",
    "luau/Config/**",
    "luau/Inliner/**",
    "luau/Require/**",
    "luau/VM/**",
    "tests/**",
    "examples/**",
    "benches/**",
    "scripts/**",
    "README.md",
    "CHANGELOG.md",
    "BENCHMARKS.md",
    "TOOLCHAIN.md",
    "QUESTIONABLE.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "rustfmt.toml",
]

[dependencies]

[build-dependencies]
# Compiles the vendored Luau tree and the C++ shims.
cc = { version = "1", features = ["parallel"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "hot_paths"
harness = false

[features]
default = []
# Luau native code generation: builds Luau's CodeGen library plus the C++ shim that exposes
# its compilation options, host IR lowering hooks, and IrBuilder to Rust (`native_code`).
jit = []
# Luau's Analysis library (type checker, linter, autocomplete) behind a C++ shim (`analysis`).
analysis = []
