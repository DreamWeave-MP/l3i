[package]
name = "dream-binder"
version = "0.1.0"
description = "Luau binder for DreamWeave component crates: typed function binding, tagged and untagged userdata, direct userdata access, sandboxed runtimes"
authors = ["Dave Corley (S3kshun8) <corleycomputerrepair@protonmail.ch>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"
keywords = ["luau", "lua", "bindings", "gamedev"]
categories = ["api-bindings", "game-development"]
links = "luau"

[dependencies]

[build-dependencies]
# Builds the Luau 0.740 release (the commit OpenMW pins) with cc. No Lua binding crate sits
# in between: the C API is declared in src/raw/ffi.rs against this library.
luau0-src = "=0.22.0"
# Compiles csrc/codegen.cpp, the C ABI over Luau's C++ code generation API (jit feature).
cc = "1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "hot_paths"
harness = false

[features]
default = []
# Luau native code generation: builds Luau's CodeGen library plus the C++ shim that exposes
# its compilation options, host IR lowering hooks, and IrBuilder to Rust (`native_code`).
jit = []
