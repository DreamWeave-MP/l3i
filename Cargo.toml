[package]
autotests = false
name = "l3i"
version = "1.3.1"
description = "Luau binder for DreamWeave component crates: typed function binding, tagged and untagged userdata, direct userdata access, sandboxed runtimes"
authors = ["Dave Corley (S3kshun8) <corleycomputerrepair@protonmail.ch>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/DreamWeave-MP/l3i"
homepage = "https://DreamWeave-MP.github.io/l3i/"
documentation = "https://DreamWeave-MP.github.io/l3i/docs/"
edition = "2024"
rust-version = "1.92"
keywords = ["luau", "lua", "bindings", "gamedev"]
categories = ["api-bindings", "game-development"]
links = "luau"
# The whole package builds from this tree: the Luau submodule (`luau/`, MIT, pinned at the
# 0.741 release; only the components the build uses are packaged) plus the binder's
# C++ additions and shims (`csrc/`). No network at build time, no separate Lua binding crate.
# Root-level entries are anchored with a leading slash: gitignore semantics would otherwise
# match a bare "README.md" at any depth, including local reference checkouts.
include = [
    "/Cargo.toml",
    "/build.rs",
    "/.gitmodules",
    "src/**",
    "csrc/**",
    "luau/LICENSE.txt",
    "luau/lua_LICENSE.txt",
    "luau/Analysis/**",
    "luau/Ast/**",
    "luau/Bytecode/**",
    "luau/CodeGen/**",
    "luau/Common/**",
    "luau/Compiler/**",
    "luau/Config/**",
    "luau/Inliner/**",
    "luau/Require/**",
    "luau/VM/**",
    "tests/**",
    "examples/**",
    "benches/**",
    "scripts/**",
    "/README.md",
    "/BENCHMARKS.md",
    "/TOOLCHAIN.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/rustfmt.toml",
]

[dependencies]
# Networking is runtime infrastructure, not a feature: l3i owns the Luau bridge to dream-net.
# Pinned exactly: the transport's wire behaviour is part of what a runtime promises.
dream-net = "=1.1.0"
# The CPU rasterizer is a domain extension, behind the `soft-render` feature.
dream-soft-render = { version = "=1.0.0", optional = true }

# `@dream/bytes` (feature `bytes`): searching through memchr's SIMD finders.
memchr = { version = "2", optional = true }
# `bytes-codecs`: pure-Rust inflate/deflate, LZ4, zstd and LZMA/XZ decoding; the gzip framing's
# CRC comes from crc32fast, which the digests share.
miniz_oxide = { version = "0.9", optional = true }
lz4_flex = { version = "0.14", optional = true }
ruzstd = { version = "0.9", optional = true }
lzma-rs = { version = "0.3", optional = true }
crc32fast = { version = "1", optional = true }
# `bytes-digests`: checksums and cryptographic digests, all Rust (BLAKE3's SIMD kernels are
# intrinsics compiled by cc, not a library).
adler2 = { version = "2", optional = true }
xxhash-rust = { version = "0.8", optional = true, features = ["xxh32", "xxh64", "xxh3"] }
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
blake3 = { version = "1", optional = true }
# `bytes-text`: every WHATWG encoding, for the codepages old formats were written in.
encoding_rs = { version = "0.8", optional = true }
# `bytes-regex`: the regex crate's byte-oriented matcher (MIT OR Apache-2.0).
regex = { version = "1.10", optional = true }
# `@dream/fs` (feature `fs`): readers over a memory map, the recursive walk, and file identity
# (device and file number; std has none on Windows). All pure Rust.
memmap2 = { version = "0.9", optional = true }
walkdir = { version = "2.5", optional = true }
same-file = { version = "1.0.6", optional = true }
# `@dream/intl` (feature `intl`): ICU4X's BCP 47 parser, CLDR plural rules and decimal
# formatting with their compiled CLDR data, and fixed_decimal's exact decimals (ryu for
# doubles). All Rust; ICU4X and its data are Unicode-3.0.
icu_locale_core = { version = "2.3", optional = true, features = ["alloc"] }
icu_plurals = { version = "2.3", optional = true }
icu_decimal = { version = "2.3", optional = true }
fixed_decimal = { version = "0.7", optional = true, features = ["ryu"] }
writeable = { version = "0.6", optional = true }

[build-dependencies]
# Compiles the vendored Luau tree and the C++ shims.
cc = { version = "1", features = ["parallel"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "udp"
harness = false

[[bench]]
name = "packed_quat"
harness = false

[[bench]]
name = "raster"
harness = false

[[bench]]
name = "instructions"
harness = false

[[bench]]
name = "soft_render"
harness = false
required-features = ["soft-render"]

[[bench]]
name = "bytes"
harness = false
required-features = ["bytes"]

[[bench]]
name = "syntax"
harness = false
required-features = ["syntax", "analysis"]

[[bench]]
name = "intern"
harness = false
required-features = ["intern"]

[[bench]]
name = "data"
harness = false
required-features = ["data"]

[[bench]]
name = "intl"
harness = false
required-features = ["intl"]

[[bench]]
name = "comprehension"
harness = false

[[bench]]
name = "patterns"
harness = false

[features]
default = []
# Luau native code generation: builds Luau's CodeGen library plus the C++ shim that exposes
# its compilation options, host IR lowering hooks, and IrBuilder to Rust (`native_code`).
jit = []
# Luau's Analysis library (type checker, linter, autocomplete) behind a C++ shim (`analysis`).
analysis = []
# dream-soft-render as the `dream.soft-render` extension (`soft_render`).
soft-render = ["dep:dream-soft-render"]
# The `@dream/bytes` extension (`bytes`): searching, comparing, C strings, varints, big-endian
# and 24-bit and half-float reads and writes, and the `bytes.math()` receiver lowered under jit.
bytes = ["dep:memchr"]
# `bytes.inflate`/`deflate` (zlib, raw, gzip), LZ4 block and frame, zstd and LZMA/XZ decoding.
bytes-codecs = ["bytes", "dep:miniz_oxide", "dep:lz4_flex", "dep:ruzstd", "dep:lzma-rs", "dep:crc32fast"]
# CRC32, Adler-32, FNV-1a, xxHash, MD5, SHA-1, SHA-256 and BLAKE3, one-shot and incremental.
bytes-digests = ["bytes", "dep:crc32fast", "dep:adler2", "dep:xxhash-rust", "dep:md-5", "dep:sha1", "dep:sha2", "dep:blake3"]
# Text decoding and encoding for every WHATWG label (windows-1252, shift_jis, utf-16 ...).
bytes-text = ["bytes", "dep:encoding_rs"]
# `bytes.regex`: regular expressions over bytes, matched against many ranges of a buffer in one call.
bytes-regex = ["bytes", "dep:regex"]
# The `@dream/data` extension (`data`): the generic bulk-data plane over typed buffer spans:
# reductions, comparisons into selections, gather/scatter, fill, element-wise arithmetic,
# stable argsort and partition, natively and without per-element callbacks.
data = []
# The `@dream/luau` extension (`syntax`): Luau's own parser for scripts, its syntax tree,
# comments, errors and tokens built as tables in native code.
syntax = []
# The `@dream/fs` extension (`fs`): the host filesystem over byte paths, gated by the
# `filesystem.read` and `filesystem.write` capabilities.
fs = ["dep:memmap2", "dep:walkdir", "dep:same-file"]
# The `@dream/process` extension (`process`): run a child process and wait for its exit code,
# gated by the `process.spawn` capability.
process = []
# The `@dream/intern` extension (`intern`): pools that turn byte sequences into dense number
# identities under exact or ASCII case-insensitive equality, lowered under jit.
intern = []
# The `@dream/intl` extension (`intl`): BCP 47 locale identity, CLDR plural rules and
# locale-aware decimal formatting.
intl = ["dep:icu_locale_core", "dep:icu_plurals", "dep:icu_decimal", "dep:fixed_decimal", "dep:writeable"]
