[package]
name = "l3i-graph-cpu-research"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
[workspace]
[dependencies]
l3i = { path = "../..", default-features = false, features = ["data"] }

[features]
# Luau's native code generator, for the generated-Luau comparator only. The kernels never need it,
# and every test runs both with and without it: no-JIT is a supported configuration, not a fallback.
luau-jit = ["l3i/jit"]
