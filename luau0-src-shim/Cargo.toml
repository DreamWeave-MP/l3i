# mlua-sys 0.12 requires luau0-src ^0.21, which tops out at Luau 0.736. OpenMW pins the
# Luau 0.740 release (commit c0e346e), published as luau0-src 0.22.0+luau740. This shim
# satisfies mlua-sys's requirement and hands it the real 0.22.0 crate unchanged. Hosts that
# want the same Luau add the same [patch.crates-io] entry the binder's Cargo.toml carries.
[package]
name = "luau0-src"
version = "0.21.100+luau740"
edition = "2024"
license = "MIT"
description = "Semver shim that points mlua-sys 0.12 at luau0-src 0.22 (Luau 0.740)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
real = { package = "luau0-src", version = "=0.22.0" }
